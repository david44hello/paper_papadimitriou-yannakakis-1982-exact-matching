name = "ExactMatching"
version = "0.1.0"
defaultTargets = ["ExactMatching"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "ExactMatching"
globs = ["ExactMatching", "ExactMatching.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }
weakLeanArgs = ["-j1"]

[[lean_lib]]
name = "RegistryChallenge"
roots = ["RegistryChallenge"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }
weakLeanArgs = ["-j1"]

[[lean_lib]]
name = "RegistrySolution"
roots = ["RegistrySolution"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }
weakLeanArgs = ["-j1"]
