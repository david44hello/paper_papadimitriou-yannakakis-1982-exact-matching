version: v0.4
project:
  name: Exact Matching (Papadimitriou–Yannakakis, 1982) in Deterministic Time 2^(n^o(1)) from Permanent
    Lower Bounds
  description: Under the paper's stated permanent lower-bound hypothesis H(c), Lean 4 verifies test correctness
    and the evaluation-point count for quantitative low-degree integer polynomial identity testing (Theorem
    1), together with the group-ring Pfaffian decision and witness-recovery reductions for Exact Matching
    (Papadimitriou–Yannakakis, 1982), polynomially bounded integer-weight perfect matching, and polynomial-order
    finite abelian-group perfect matching (Theorem 2(a)–(c)), proved from Lean's three standard axioms
    alone with no cited inputs. Deterministic Turing-machine running-time bounds and randomized/parallel
    complexity remarks are outside verification.
  authors:
  - Dave Goel
  license: Apache-2.0
  responsible_maintainers:
  - Dave Goel
