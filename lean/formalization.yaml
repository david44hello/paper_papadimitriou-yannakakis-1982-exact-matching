status:
  scope: The five statements formalize the test and count in Theorem 1 and the decision and witness conclusions
    of Theorem 2(a)–(c). Four statements take the paper’s permanent lower bound H(c) as an explicit hypothesis,
    for c > 0 and a specified size threshold. The separate evaluation-count bound needs only its parameter
    conditions. The full paper project compares 35 declarations. Two declarations in Corollary 1 assume
    Theorem 1.1 of the November 2026 preprint by Claude (Anthropic). Remark 1 assumes Theorem 1.1 of the
    November 2026 preprint by OpenAI. Both preprints are unrefereed. The registry selects Theorems 1 and
    2(a)–(c).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
  - propext
  - Quot.sound
  - Classical.choice
automation:
  methods:
  - method: agent
    tool_setup: AI agents wrote and checked the Lean proofs under the author’s direction.
fidelity:
  divergences: The three matching statements treat graphs with an even number of vertices, 2k with k ≥
    1. The full paper project separately proves that odd-order graphs have no perfect matching. The evaluation-count
    bounds are formalized. Eight deterministic Turing-machine running-time clauses and the randomized
    and parallel complexity remark in Table 1 (RNC, RP, coRP) are outside the formal verification.
review:
  status: agent-reviewed
  reviewers:
  - Google Gemini
  notes: The published v2.00 proof passed a clean build, axiom audit, kernel replay and standard and paranoid
    comparison of all 35 declarations. An independent Google Gemini check matched the five selected statements,
    their definitions and hypotheses to the paper. The registry package compiled in development, and the
    66 named Challenge and Solution declaration interfaces matched.
alignment:
