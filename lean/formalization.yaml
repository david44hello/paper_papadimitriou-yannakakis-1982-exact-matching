  statements:
  - source: Theorem 1, correctness
    lean: ExactMatching.Paper.thm_1_test_correct
    module: RegistryChallenge
    status: proved
    note: Correctness of the small and large tests under H(c).
  - source: Theorem 1, evaluation count
    lean: ExactMatching.Paper.thm_1_eval_points
    module: RegistryChallenge
    status: proved
    note: Evaluation-count bound for the specified parameters, without H(c).
  - source: Theorem 2(a)
    lean: ExactMatching.Paper.thm_2a_decision_witness
    module: RegistryChallenge
    status: proved
    note: Decision and witness recovery for a prescribed red-edge count under H(c).
  - source: Theorem 2(b)
    lean: ExactMatching.Paper.thm_2b_decision_witness
    module: RegistryChallenge
    status: proved
    note: Decision and witness recovery for a prescribed bounded integer-weight sum under H(c).
  - source: Theorem 2(c)
    lean: ExactMatching.Paper.thm_2c_decision_witness
    module: RegistryChallenge
    status: proved
    note: Decision and witness recovery for a prescribed sum in any finite abelian group under H(c).
